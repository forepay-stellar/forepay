[package]
name = "forepay-advance"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Forepay advance contract — a zkTLS-proven revenue figure sized into a USDC advance"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# Version pinned once, in the workspace root (sc/Cargo.toml).
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }


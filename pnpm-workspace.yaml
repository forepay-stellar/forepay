# One pnpm workspace, one lockfile, for every TypeScript package (Forepay #1).
# Rust lives in its own Cargo workspace under sc/. See CLAUDE.md for why.
packages:
  - be
  - fe
  - landing-page

# Every dependency with an install script must be decided here, in review.
# pnpm fails the install on an undecided one, so a new transitive postinstall
# cannot slip in unnoticed.
allowBuilds:
  # esbuild (via tsx) ships its binary as an optional per-platform dependency;
  # its postinstall only re-checks what is already there. CI's `be` tests run
  # through tsx, so they prove it works without the script.
  esbuild: false
  # Native resolver used by eslint-config-next.
  unrs-resolver: true

  # Pulled in by @reclaimprotocol/zk-fetch (#4). All four are refused: zk-fetch
  # loads and proves without them.
  #  - re2: native regex. Without it zk-fetch logs "falling back to native
  #    RegExp". Response matching is evaluated by the attestor, not here, and
  #    the regexes are ours. Its install script downloads a binary at install.
  #  - koffi: FFI for the TEE path (useTee), which Forepay does not use.
  #  - @swc/core, cbor-extract: ship per-platform optional binaries / JS fallback.
  # If one becomes necessary, allow that one, here, with the reason.
  '@swc/core': false
  cbor-extract: false
  koffi: false
  re2: false
